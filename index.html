<!DOCTYPE html>
<!-- Dit au navigateur que c'est une page HTML5 -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Permet d'afficher correctement la page sur téléphone (sans cette ligne, elle serait minuscule) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>

  <style>
    /* Style de toute la page */
    body {
      font-family: sans-serif;
      margin: 0;               /* pas de marge autour de la page */
      background: #f4f4f4;     /* fond gris clair */
    }
    /* Bandeau du haut */
    header {
      background: #2c7be5;     /* bleu */
      color: white;
      padding: 16px;
      text-align: center;
    }
    /* Contenu principal : centré et limité en largeur (pensé pour mobile) */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
            /* Les étiquettes au-dessus de chaque champ */
        label {
          display: block;          /* chaque étiquette sur sa propre ligne */
          margin-top: 12px;
          font-weight: bold;
        }
        /* Les champs et le bouton prennent toute la largeur */
        select, input, button {
          width: 100%;
          box-sizing: border-box;  /* la bordure et le padding comptent dans la largeur */
          padding: 10px;
          margin-top: 4px;
          font-size: 16px;         /* évite le zoom automatique sur iPhone */
        }
        button {
          background: #2c7be5;
          color: white;
          border: none;
          border-radius: 6px;
          margin-top: 16px;
        }

    #btn-deconnexion { background: #888; margin-top: 0; }  /* bouton gris, plus discret */
    #erreur-connexion { color: #c0392b; }                  /* message d'erreur en rouge */
    
  </style>
</head>
<body>
  <header>
    <h1>Mon budget</h1>
  </header>

  <!-- Écran de connexion : visible seulement si personne n'est connecté -->
    <main id="ecran-connexion">
      <form id="form-connexion">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
    
        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" required>
    
        <button type="submit">Se connecter</button>
        <p id="erreur-connexion"></p>
      </form>
    </main>
  

  <!-- "hidden" = cachée au départ ; le script la montrera après la connexion -->
<main id="ecran-appli" hidden>
  <p>Connecté : <strong id="nom-utilisateur"></strong></p>
  <button id="btn-deconnexion">Se déconnecter</button>
  
    <!-- Le formulaire : chaque <label> décrit un champ, chaque <input>/<select> est le champ lui-même -->
    <form id="form-depense">
    
      <label for="categorie">Catégorie</label>
      <!-- <select> = liste déroulante -->
      <select id="categorie">
        <option>Alimentaire générale</option>
        <option>Restaurant</option>
        <option>Vêtements</option>
        <option>Divers</option>
      </select>
    
      <label for="date">Date</label>
      <!-- type="date" affiche un calendrier sur téléphone -->
      <input type="date" id="date">
    
      <label for="montant">Montant (€)</label>
      <!-- type="number" affiche le clavier numérique ; step="0.01" autorise les centimes -->
      <input type="number" id="montant" step="0.01" min="0">
    
      <label for="note">Note (facultatif)</label>
      <input type="text" id="note">
    
      <button type="submit">Ajouter la dépense</button>
    </form>

    <!-- Zone où s'affichera la liste des dépenses saisies -->
    <h2>Dépenses saisies</h2>
    <ul id="liste"></ul>
    
  </main>

    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  // NOUVEAU : les outils de connexion
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCqOSzPuamD_Q-p5keXnzRzPpK7C9GN1m8",
    authDomain: "budget-app-67ceb.firebaseapp.com",
    projectId: "budget-app-67ceb",
    storageBucket: "budget-app-67ceb.firebasestorage.app",
    messagingSenderId: "939010447229",
    appId: "1:939010447229:web:ecd2272109378898011e14"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);               // NOUVEAU : le service de connexion
  const depensesRef = collection(db, "depenses");

  // --- Éléments de la page ---
  const formulaire = document.getElementById("form-depense");
  const liste = document.getElementById("liste");
  // NOUVEAU
  const ecranConnexion = document.getElementById("ecran-connexion");
  const ecranAppli = document.getElementById("ecran-appli");
  const formConnexion = document.getElementById("form-connexion");
  const erreurConnexion = document.getElementById("erreur-connexion");
  const nomUtilisateur = document.getElementById("nom-utilisateur");
  const btnDeconnexion = document.getElementById("btn-deconnexion");

  function dateDuJour() {
    return new Date().toLocaleDateString("sv-SE");
  }
  document.getElementById("date").value = dateDuJour();

  // NOUVEAU : nom court affiché = ce qui est avant le "@" de l'e-mail
  function nomCourt(utilisateur) {
    return utilisateur.email.split("@")[0];
  }

  // --- NOUVEAU : CONNEXION ---
  formConnexion.addEventListener("submit", async function (event) {
    event.preventDefault();
    erreurConnexion.textContent = "";
    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("email").value,
        document.getElementById("mdp").value
      );
      formConnexion.reset();   // on efface le mot de passe saisi
    } catch (erreur) {
      erreurConnexion.textContent = "E-mail ou mot de passe incorrect.";
    }
  });

  // --- NOUVEAU : DÉCONNEXION ---
  btnDeconnexion.addEventListener("click", function () {
    signOut(auth);
  });

  // --- ENVOI D'UNE DÉPENSE ---
  formulaire.addEventListener("submit", async function (event) {
    event.preventDefault();

    const depense = {
      categorie: document.getElementById("categorie").value,
      date: document.getElementById("date").value,
      montant: parseFloat(document.getElementById("montant").value),
      note: document.getElementById("note").value,
      // NOUVEAU : qui a saisi la dépense, d'après le compte connecté
      saisiPar: nomCourt(auth.currentUser)
    };

    if (isNaN(depense.montant) || depense.montant <= 0) {
      alert("Entre un montant valide.");
      return;
    }

    try {
      await addDoc(depensesRef, depense);
      formulaire.reset();
      document.getElementById("date").value = dateDuJour();
    } catch (erreur) {
      alert("Erreur d'enregistrement : " + erreur.message);
    }
  });

  // --- LECTURE EN TEMPS RÉEL ---
  // NOUVEAU : on ne l'active plus au chargement mais APRÈS la connexion.
  // onSnapshot renvoie une fonction qui permet d'arrêter l'écoute : on la garde.
  let arreterEcoute = null;

  function demarrerEcoute() {
    const requete = query(depensesRef, orderBy("date", "desc"));
    arreterEcoute = onSnapshot(
      requete,
      function (snapshot) {
        liste.innerHTML = "";
        snapshot.forEach(function (doc) {
          const d = doc.data();
          const li = document.createElement("li");
          li.textContent = d.date + " – " + d.categorie + " : " +
                           d.montant.toFixed(2) + " €" +
                           (d.note ? " (" + d.note + ")" : "") +
                           // NOUVEAU : les anciennes dépenses de test n'ont pas de "saisiPar"
                           (d.saisiPar ? " – par " + d.saisiPar : "");
          liste.appendChild(li);
        });
      },
      function (erreur) {
        console.error("Erreur de lecture :", erreur);
      }
    );
  }

  // --- NOUVEAU : SURVEILLER L'ÉTAT DE CONNEXION ---
  // Cette fonction s'exécute au chargement, puis à chaque connexion/déconnexion.
  // "user" contient le compte si on est connecté, sinon "null".
  onAuthStateChanged(auth, function (user) {
    if (user) {
      ecranConnexion.hidden = true;     // on cache la connexion
      ecranAppli.hidden = false;        // on montre l'appli
      nomUtilisateur.textContent = nomCourt(user);
      demarrerEcoute();
    } else {
      ecranConnexion.hidden = false;
      ecranAppli.hidden = true;
      if (arreterEcoute) {              // on arrête d'écouter la base
        arreterEcoute();
        arreterEcoute = null;
      }
      liste.innerHTML = "";
    }
  });
</script>

  
</body>
</html>
