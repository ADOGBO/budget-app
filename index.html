<!DOCTYPE html>
<!-- Dit au navigateur que c'est une page HTML5 -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Permet d'afficher correctement la page sur téléphone (sans cette ligne, elle serait minuscule) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>

  <style>
    /* Style de toute la page */
    body {
      font-family: sans-serif;
      margin: 0;               /* pas de marge autour de la page */
      background: #f4f4f4;     /* fond gris clair */
    }
    /* Bandeau du haut */
    header {
      background: #2c7be5;     /* bleu */
      color: white;
      padding: 16px;
      text-align: center;
    }
    /* Contenu principal : centré et limité en largeur (pensé pour mobile) */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mon budget</h1>
  </header>

  <main>
    <p>Bientôt : le formulaire de saisie des dépenses.</p>
  </main>
</body>
</html>
