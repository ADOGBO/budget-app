<!DOCTYPE html>
<!-- Dit au navigateur que c'est une page HTML5 -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Permet d'afficher correctement la page sur téléphone (sans cette ligne, elle serait minuscule) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>

  <style>
    /* Style de toute la page */
    body {
      font-family: sans-serif;
      margin: 0;               /* pas de marge autour de la page */
      background: #f4f4f4;     /* fond gris clair */
    }
    /* Bandeau du haut */
    header {
      background: #2c7be5;     /* bleu */
      color: white;
      padding: 16px;
      text-align: center;
    }
    /* Contenu principal : centré et limité en largeur (pensé pour mobile) */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
            /* Les étiquettes au-dessus de chaque champ */
        label {
          display: block;          /* chaque étiquette sur sa propre ligne */
          margin-top: 12px;
          font-weight: bold;
        }
        /* Les champs et le bouton prennent toute la largeur */
        select, input, button {
          width: 100%;
          box-sizing: border-box;  /* la bordure et le padding comptent dans la largeur */
          padding: 10px;
          margin-top: 4px;
          font-size: 16px;         /* évite le zoom automatique sur iPhone */
        }
        button {
          background: #2c7be5;
          color: white;
          border: none;
          border-radius: 6px;
          margin-top: 16px;
        }
  </style>
</head>
<body>
  <header>
    <h1>Mon budget</h1>
  </header>

  <main>
    <!-- Le formulaire : chaque <label> décrit un champ, chaque <input>/<select> est le champ lui-même -->
    <form id="form-depense">
    
      <label for="categorie">Catégorie</label>
      <!-- <select> = liste déroulante -->
      <select id="categorie">
        <option>Alimentaire générale</option>
        <option>Restaurant</option>
        <option>Vêtements</option>
        <option>Divers</option>
      </select>
    
      <label for="date">Date</label>
      <!-- type="date" affiche un calendrier sur téléphone -->
      <input type="date" id="date">
    
      <label for="montant">Montant (€)</label>
      <!-- type="number" affiche le clavier numérique ; step="0.01" autorise les centimes -->
      <input type="number" id="montant" step="0.01" min="0">
    
      <label for="note">Note (facultatif)</label>
      <input type="text" id="note">
    
      <button type="submit">Ajouter la dépense</button>
    </form>

    <!-- Zone où s'affichera la liste des dépenses saisies -->
    <h2>Dépenses saisies</h2>
    <ul id="liste"></ul>
    
  </main>

    <script>
    // Un tableau : une liste qui contiendra toutes les dépenses.
    // "const" = on ne remplace pas le tableau, mais on peut y ajouter des éléments.
    const depenses = [];
  
    // On récupère les éléments de la page grâce à leur id
    const formulaire = document.getElementById("form-depense");
    const liste = document.getElementById("liste");
  
    // Renvoie la date du jour au format AAAA-MM-JJ (le format attendu par le champ date).
    // "sv-SE" (suédois) est une astuce : cette langue écrit les dates exactement ainsi.
    function dateDuJour() {
      return new Date().toLocaleDateString("sv-SE");
    }
  
    // On pré-remplit le champ date avec aujourd'hui
    document.getElementById("date").value = dateDuJour();
  
    // "Quand le formulaire est envoyé (clic sur le bouton), exécute cette fonction"
    formulaire.addEventListener("submit", function (event) {
      // Par défaut, envoyer un formulaire recharge la page : on l'empêche
      event.preventDefault();
  
      // Un objet : un « paquet » qui regroupe les infos d'une dépense
      const depense = {
        categorie: document.getElementById("categorie").value,
        date: document.getElementById("date").value,
        montant: parseFloat(document.getElementById("montant").value), // texte -> nombre
        note: document.getElementById("note").value
      };
  
      // Vérification : le montant doit être un nombre positif
      if (isNaN(depense.montant) || depense.montant <= 0) {
        alert("Entre un montant valide.");
        return; // on s'arrête ici
      }
  
      depenses.push(depense);   // on ajoute la dépense à la fin du tableau
      afficherListe();          // on met à jour l'affichage
  
      // On vide le formulaire, puis on remet la date du jour
      formulaire.reset();
      document.getElementById("date").value = dateDuJour();
    });
  
    // Reconstruit la liste affichée à partir du tableau
    function afficherListe() {
      liste.innerHTML = "";                  // on efface l'ancienne liste
      for (const d of depenses) {            // pour chaque dépense du tableau...
        const li = document.createElement("li");   // ...on crée une ligne de liste
        // textContent insère du texte brut (plus sûr que innerHTML)
        li.textContent = d.date + " – " + d.categorie + " : " +
                         d.montant.toFixed(2) + " €" +
                         (d.note ? " (" + d.note + ")" : "");
        liste.appendChild(li);               // ...et on l'ajoute à la page
      }
    }
  </script>

  
</body>
</html>
