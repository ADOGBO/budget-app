<!DOCTYPE html>
<!-- Dit au navigateur que c'est une page HTML5 -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Permet d'afficher correctement la page sur téléphone (sans cette ligne, elle serait minuscule) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>

  <style>
    /* Style de toute la page */
    body {
      font-family: sans-serif;
      margin: 0;               /* pas de marge autour de la page */
      background: #f4f4f4;     /* fond gris clair */
    }
    /* Bandeau du haut */
    header {
      background: #2c7be5;     /* bleu */
      color: white;
      padding: 16px;
      text-align: center;
    }
    /* Contenu principal : centré et limité en largeur (pensé pour mobile) */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
            /* Les étiquettes au-dessus de chaque champ */
        label {
          display: block;          /* chaque étiquette sur sa propre ligne */
          margin-top: 12px;
          font-weight: bold;
        }
        /* Les champs et le bouton prennent toute la largeur */
        select, input, button {
          width: 100%;
          box-sizing: border-box;  /* la bordure et le padding comptent dans la largeur */
          padding: 10px;
          margin-top: 4px;
          font-size: 16px;         /* évite le zoom automatique sur iPhone */
        }
        button {
          background: #2c7be5;
          color: white;
          border: none;
          border-radius: 6px;
          margin-top: 16px;
        }
  </style>
</head>
<body>
  <header>
    <h1>Mon budget</h1>
  </header>

  <main>
    <!-- Le formulaire : chaque <label> décrit un champ, chaque <input>/<select> est le champ lui-même -->
    <form id="form-depense">
    
      <label for="categorie">Catégorie</label>
      <!-- <select> = liste déroulante -->
      <select id="categorie">
        <option>Alimentaire générale</option>
        <option>Restaurant</option>
        <option>Vêtements</option>
        <option>Divers</option>
      </select>
    
      <label for="date">Date</label>
      <!-- type="date" affiche un calendrier sur téléphone -->
      <input type="date" id="date">
    
      <label for="montant">Montant (€)</label>
      <!-- type="number" affiche le clavier numérique ; step="0.01" autorise les centimes -->
      <input type="number" id="montant" step="0.01" min="0">
    
      <label for="note">Note (facultatif)</label>
      <input type="text" id="note">
    
      <button type="submit">Ajouter la dépense</button>
    </form>

    <!-- Zone où s'affichera la liste des dépenses saisies -->
    <h2>Dépenses saisies</h2>
    <ul id="liste"></ul>
    
  </main>

    <!-- type="module" : nécessaire pour utiliser "import" -->
<script type="module">
  // 1) On importe les outils Firebase depuis les serveurs de Google
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // 2) La configuration : elle dit à la page quel projet Firebase utiliser
  const firebaseConfig = {
    apiKey: "AIzaSyCqOSzPuamD_Q-p5keXnzRzPpK7C9GN1m8",
    authDomain: "budget-app-67ceb.firebaseapp.com",
    projectId: "budget-app-67ceb",
    storageBucket: "budget-app-67ceb.firebasestorage.app",
    messagingSenderId: "939010447229",
    appId: "1:939010447229:web:ecd2272109378898011e14"
  };

  // 3) On démarre Firebase, puis on se connecte à la base Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Dans Firestore, les données sont rangées dans des "collections".
  // Ici : une collection "depenses", créée automatiquement à la première dépense.
  const depensesRef = collection(db, "depenses");

  // --- Éléments de la page ---
  const formulaire = document.getElementById("form-depense");
  const liste = document.getElementById("liste");

  function dateDuJour() {
    return new Date().toLocaleDateString("sv-SE");
  }
  document.getElementById("date").value = dateDuJour();

  // --- ENVOI : quand on clique sur "Ajouter la dépense" ---
  // "async" : la fonction peut attendre (await) la réponse d'Internet
  formulaire.addEventListener("submit", async function (event) {
    event.preventDefault();

    const depense = {
      categorie: document.getElementById("categorie").value,
      date: document.getElementById("date").value,
      montant: parseFloat(document.getElementById("montant").value),
      note: document.getElementById("note").value
    };

    if (isNaN(depense.montant) || depense.montant <= 0) {
      alert("Entre un montant valide.");
      return;
    }

    // try/catch : si l'envoi échoue (pas de réseau, accès refusé...),
    // on affiche l'erreur au lieu de planter en silence
    try {
      // addDoc envoie la dépense dans Firestore ; "await" attend la confirmation
      await addDoc(depensesRef, depense);
      formulaire.reset();
      document.getElementById("date").value = dateDuJour();
    } catch (erreur) {
      alert("Erreur d'enregistrement : " + erreur.message);
    }
  });

  // --- LECTURE EN TEMPS RÉEL ---
  // On demande les dépenses triées par date, de la plus récente à la plus ancienne
  const requete = query(depensesRef, orderBy("date", "desc"));

  // onSnapshot : "écoute" la base. Cette fonction s'exécute au chargement
  // PUIS automatiquement à chaque changement (même fait depuis un autre téléphone).
  onSnapshot(requete, function (snapshot) {
    liste.innerHTML = "";
    snapshot.forEach(function (doc) {
      const d = doc.data();   // récupère le contenu de la dépense
      const li = document.createElement("li");
      li.textContent = d.date + " – " + d.categorie + " : " +
                       d.montant.toFixed(2) + " €" +
                       (d.note ? " (" + d.note + ")" : "");
      liste.appendChild(li);
    });
  });
</script>

  
</body>
</html>
